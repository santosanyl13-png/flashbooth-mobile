<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashBooth Pro — Mobile Camera</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Top Status Bar -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-30">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-camera text-indigo-400 text-xl"></i>
      <h1 class="font-bold text-sm tracking-wide text-white">FlashBooth <span class="text-indigo-400">Mobile</span></h1>
    </div>
    <div class="flex items-center gap-2">
      <!-- Camera Flip Button -->
      <button onclick="toggleCameraFacing()" id="btnFlipCam" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shadow" title="Switch Camera">
        <i class="fa-solid fa-rotate"></i> <span id="flipText">Flip</span>
      </button>

      <!-- Grid Toggle Button -->
      <button onclick="toggleMobileGrid()" id="btnMobileGrid" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shadow">
        <i class="fa-solid fa-table-cells"></i> <span id="mobileGridText">Grid: Off</span>
      </button>

      <span id="connStatus" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Connecting
      </span>
    </div>
  </header>

  <!-- Camera Viewport Container -->
  <main class="flex-1 relative bg-black flex items-center justify-center overflow-hidden">
    <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
    <canvas id="captureCanvas" class="hidden"></canvas>

    <!-- 3x3 Alignment Grid Overlay -->
    <div id="mobileGridOverlay" class="absolute inset-0 pointer-events-none grid grid-cols-3 grid-rows-3 opacity-60 hidden z-20">
      <div class="border-r border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class="border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class="border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class=""></div>
    </div>

    <!-- Start Camera Overlay (Required for Browser Autoplay / Permissions) -->
    <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md z-40 flex flex-col items-center justify-center p-6 text-center">
      <i class="fa-solid fa-camera-retro text-6xl text-indigo-400 mb-4 animate-bounce"></i>
      <h2 class="text-xl font-bold text-white mb-2">Ready to Connect</h2>
      <p class="text-xs text-slate-400 max-w-xs mb-6">Tap below to grant camera access and connect to your PC photobooth control station.</p>
      <button onclick="initMobileCameraSession()" class="w-full max-w-xs py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition text-base flex items-center justify-center gap-2">
        <i class="fa-solid fa-play"></i> Start Camera & Connect
      </button>
    </div>
  </main>

  <!-- Mobile Script Logic with TURN Servers, Reconnect Handling & Full Features -->
  <script>
    // --- Configuration -----------------------------------------------
    // Free/rate-limited demo TURN relay — fine for testing, swap for a
    // paid TURN provider (Twilio, Xirsys, metered.ca paid tier, or a
    // self-hosted coturn instance) before relying on this at a real event.
    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
    ];
    const MAX_RECONNECT_ATTEMPTS = 5;

    // Live preview quality tuning. Without these, the browser's WebRTC
    // encoder picks its own (often conservative) bitrate/resolution
    // trade-off, which is why the PC's live preview can look noticeably
    // softer than what the phone's camera actually sees — the final
    // capture bypasses this encoder entirely so it isn't affected.
    const VIDEO_MAX_BITRATE_BPS = 3000000; // ~3 Mbps cap: generous for a sharp 1080p feed, not so high it floods event wifi
    const VIDEO_FRAME_RATE = { ideal: 20, max: 30 }; // photobooth subjects are posed, not fast-moving — trade smoothness for sharpness

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId');

    const localVideo = document.getElementById('localVideo');
    const captureCanvas = document.getElementById('captureCanvas');
    const connStatus = document.getElementById('connStatus');
    const startOverlay = document.getElementById('startOverlay');

    let localStream = null;
    let peer = null;
    let dataConn = null;
    let currentCall = null;
    let isGridOn = false;
    let useFrontCamera = true;

    let currentHostId = null;
    let reconnectAttempts = 0;
    let reconnectTimer = null;

    // Hints the browser to favor per-frame sharpness over motion smoothness
    // for this track — the right trade-off for a photobooth preview.
    function applyTrackContentHint(stream) {
      if (!stream) return;
      const videoTrack = stream.getVideoTracks()[0];
      if (videoTrack && 'contentHint' in videoTrack) {
        videoTrack.contentHint = 'detail';
      }
    }

    // Raises the video encoder's bitrate ceiling and tells it to protect
    // resolution (rather than silently downscaling) if bandwidth gets
    // tight. Safe to call before ICE negotiation finishes; browsers apply
    // it once the encoder starts. Wrapped defensively since setParameters
    // support/behavior varies slightly across mobile browsers.
    function applyVideoSenderQualityHints(call) {
      try {
        const pc = call && call.peerConnection;
        if (!pc) return;
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (!sender) return;

        const params = sender.getParameters();
        if (!params.encodings || params.encodings.length === 0) {
          params.encodings = [{}];
        }
        params.encodings[0].maxBitrate = VIDEO_MAX_BITRATE_BPS;
        params.degradationPreference = 'maintain-resolution';

        const result = sender.setParameters(params);
        if (result && typeof result.catch === 'function') {
          result.catch((err) => console.log('Could not apply video sender quality hints:', err));
        }
      } catch (err) {
        console.log('Could not apply video sender quality hints:', err);
      }
    }

    function toggleMobileGrid() {
      isGridOn = !isGridOn;
      const overlay = document.getElementById('mobileGridOverlay');
      const gridText = document.getElementById('mobileGridText');
      const btnGrid = document.getElementById('btnMobileGrid');

      if (isGridOn) {
        overlay.classList.remove('hidden');
        gridText.innerText = "Grid: On";
        btnGrid.className = "text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shadow";
      } else {
        overlay.classList.add('hidden');
        gridText.innerText = "Grid: Off";
        btnGrid.className = "text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shadow";
      }
    }

    async function toggleCameraFacing() {
      useFrontCamera = !useFrontCamera;
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: useFrontCamera ? 'user' : 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: VIDEO_FRAME_RATE
          },
          audio: false
        });

        applyTrackContentHint(localStream);

        localVideo.srcObject = localStream;
        await localVideo.play();

        if (currentCall && peer) {
          const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) {
            await sender.replaceTrack(localStream.getVideoTracks()[0]);
            // replaceTrack can reset encoding parameters on some browsers, so reapply them.
            applyVideoSenderQualityHints(currentCall);
          }
        }
      } catch (err) {
        alert("Camera switch error: " + err.message);
      }
    }

    async function initMobileCameraSession() {
      if (!roomId) {
        alert("Error: Missing Room ID in URL!");
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: useFrontCamera ? 'user' : 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: VIDEO_FRAME_RATE
          },
          audio: false
        });

        applyTrackContentHint(localStream);

        localVideo.srcObject = localStream;
        await localVideo.play();
        startOverlay.classList.add('hidden');

        connectToHostPeer(roomId);
      } catch (err) {
        alert("Camera permission error: " + err.message);
      }
    }

    function connectToHostPeer(hostId) {
      currentHostId = hostId;
      reconnectAttempts = 0;

      peer = new Peer({
        debug: 1,
        config: { iceServers: ICE_SERVERS }
      });

      peer.on('open', () => {
        reconnectAttempts = 0;
        setConnStatus('connected');
        startCallAndData(hostId);
      });

      peer.on('disconnected', () => {
        // Signaling connection to PeerJS's broker dropped (wifi hiccup, phone
        // sleep). The WebRTC call may still survive briefly; try to bring the
        // signaling channel back without making the user re-scan the QR code.
        setConnStatus('reconnecting');
        scheduleReconnect();
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        setConnStatus('reconnecting');
        scheduleReconnect();
      });

      peer.on('close', () => {
        setConnStatus('disconnected');
      });
    }

    function startCallAndData(hostId) {
      currentCall = peer.call(hostId, localStream);
      applyVideoSenderQualityHints(currentCall);
      currentCall.on('close', () => {
        setConnStatus('reconnecting');
        scheduleReconnect();
      });

      dataConn = peer.connect(hostId);
      dataConn.on('data', (packet) => {
        if (packet.type === 'TRIGGER_HIGH_RES_CAPTURE') {
          captureAndSendHighResPhoto();
        }
      });
    }

    function scheduleReconnect() {
      if (reconnectTimer) return; // a retry is already pending

      if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
        setConnStatus('failed');
        return;
      }

      reconnectAttempts++;
      const delay = Math.min(1000 * reconnectAttempts, 5000); // simple backoff, capped at 5s

      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        if (!peer || peer.destroyed) return;

        if (peer.disconnected) {
          peer.reconnect();
        } else if (currentHostId) {
          startCallAndData(currentHostId);
        }
      }, delay);
    }

    function captureAndSendHighResPhoto() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      const settings = track.getSettings();

      const width = settings.width || 1920;
      const height = settings.height || 1080;

      captureCanvas.width = width;
      captureCanvas.height = height;
      const ctx = captureCanvas.getContext('2d');
      ctx.drawImage(localVideo, 0, 0, width, height);

      const highResDataUrl = captureCanvas.toDataURL('image/jpeg', 0.95);

      if (dataConn && dataConn.open) {
        dataConn.send({
          type: 'HIGH_RES_PHOTO',
          data: highResDataUrl
        });
      }
    }

    function setConnStatus(state) {
      if (state === 'connected') {
        connStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        connStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Connected`;
      } else if (state === 'reconnecting') {
        connStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30";
        connStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Reconnecting...`;
      } else if (state === 'failed') {
        connStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30";
        connStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> Lost connection — reload page`;
      } else {
        connStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30";
        connStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400 animate-pulse"></span> Disconnected`;
      }
    }
  </script>
</body>
</html>
