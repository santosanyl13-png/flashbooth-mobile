<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlashBooth Pro — Wireless Camera</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    /* CSS Mirror transformation for selfie front camera preview */
    .mirror {
      transform: scaleX(-1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans select-none">

  <!-- Header -->
  <header class="text-center py-2 border-b border-slate-800">
    <h1 class="text-xl font-bold tracking-wide text-white">
      FlashBooth <span class="text-indigo-400">Pro</span> Camera
    </h1>
    <p class="text-xs text-slate-400 mt-0.5">Wireless WebRTC Smartphone Stream</p>
  </header>

  <!-- Video Preview Box -->
  <main class="my-auto flex flex-col items-center">
    <div class="relative w-full aspect-[3/4] max-w-sm bg-black rounded-3xl overflow-hidden border-2 border-slate-800 shadow-2xl flex items-center justify-center">
      <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
      
      <!-- Overlay status badge -->
      <div id="statusBadge" class="absolute top-4 left-4 bg-black/60 backdrop-blur-md border border-white/10 px-3 py-1 rounded-full text-xs font-semibold text-amber-400 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Ready to Connect
      </div>

      <!-- Initial Start Overlay Prompt -->
      <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10">
        <i class="fa-solid fa-camera text-5xl text-indigo-400 mb-4 animate-bounce"></i>
        <h2 class="text-lg font-bold text-white mb-2">Tap to Start Camera</h2>
        <p class="text-xs text-slate-400 mb-6 leading-relaxed">
          Grant camera permission to stream wirelessly to the Photobooth Control Station.
        </p>
        <button id="btnStart" onclick="initMobileCamera()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold rounded-2xl shadow-xl transition text-base flex items-center justify-center gap-2">
          <i class="fa-solid fa-power-off"></i> Start Camera Stream
        </button>
      </div>
    </div>

    <!-- Error Message Banner -->
    <div id="errorBanner" class="w-full max-w-sm mt-3 p-3 bg-red-900/40 border border-red-500/40 rounded-xl text-red-200 text-xs text-center hidden"></div>
  </main>

  <!-- Controls Footer -->
  <footer class="w-full max-w-sm mx-auto space-y-3 pb-2">
    <div class="grid grid-cols-2 gap-3">
      <button id="btnSwitchCam" onclick="switchCamera()" disabled class="py-3 px-4 bg-slate-800 hover:bg-slate-700 active:scale-95 disabled:opacity-50 text-slate-200 font-semibold rounded-xl text-xs flex items-center justify-center gap-2 border border-slate-700 transition">
        <i class="fa-solid fa-repeat"></i> Flip Camera
      </button>

      <button id="btnRetry" onclick="connectToHost()" disabled class="py-3 px-4 bg-slate-800 hover:bg-slate-700 active:scale-95 disabled:opacity-50 text-slate-200 font-semibold rounded-xl text-xs flex items-center justify-center gap-2 border border-slate-700 transition">
        <i class="fa-solid fa-rotate-right"></i> Reconnect
      </button>
    </div>
  </footer>

  <script>
    // State variables
    let peer = null;
    let localStream = null;
    let activeCall = null;
    let currentFacingMode = "environment"; // "environment" (rear) or "user" (front)
    let roomId = null;

    const localVideo = document.getElementById('localVideo');
    const statusBadge = document.getElementById('statusBadge');
    const startOverlay = document.getElementById('startOverlay');
    const errorBanner = document.getElementById('errorBanner');
    const btnSwitchCam = document.getElementById('btnSwitchCam');
    const btnRetry = document.getElementById('btnRetry');

    // Parse Room ID from URL query param
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      roomId = params.get('roomId');

      if (!roomId) {
        showError("Missing Room ID in URL! Please scan the QR code generated by the PC Control Station.");
        document.getElementById('btnStart').disabled = true;
      }
    });

    /**
     * Called on user gesture (Tap to Start Camera).
     */
    async function initMobileCamera() {
      if (!roomId) return;
      hideError();

      try {
        await startCameraStream();
        startOverlay.classList.add('hidden');
        btnSwitchCam.disabled = false;
        btnRetry.disabled = false;
        
        // Connect to PC Peer
        initPeerJS();
      } catch (err) {
        console.error('Camera Init Error:', err);
        showError("Camera Access Failed: " + (err.message || err.name));
      }
    }

    /**
     * Requests WebRTC media stream from device.
     */
    async function startCameraStream() {
      // Stop existing tracks
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: currentFacingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      localVideo.srcObject = localStream;

      // Apply CSS mirroring if front camera
      if (currentFacingMode === "user") {
        localVideo.classList.add('mirror');
      } else {
        localVideo.classList.remove('mirror');
      }
    }

    /**
     * Initializes PeerJS client and calls host ID.
     */
    function initPeerJS() {
      updateStatus("Connecting...", "amber");

      if (peer) {
        peer.destroy();
      }

      peer = new Peer({
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        connectToHost();
      });

      peer.on('error', (err) => {
        console.error("Peer error:", err);
        updateStatus("Connection Error", "red");
        showError("PeerJS Error: " + err.type);
      });

      peer.on('disconnected', () => {
        updateStatus("Disconnected", "red");
      });
    }

    function connectToHost() {
      if (!peer || !localStream || !roomId) return;

      hideError();
      updateStatus("Calling PC...", "amber");

      if (activeCall) {
        activeCall.close();
      }

      // Initiate media call to PC host ID
      activeCall = peer.call(roomId, localStream);

      if (!activeCall) {
        showError("Failed to initiate call to Host ID: " + roomId);
        return;
      }

      updateStatus("Streaming Live!", "emerald");

      activeCall.on('close', () => {
        updateStatus("Call Ended", "amber");
      });

      activeCall.on('error', (err) => {
        console.error("Call error:", err);
        updateStatus("Call Error", "red");
        showError("Call error: " + err.toString());
      });
    }

    /**
     * Switches front/rear camera.
     */
    async function switchCamera() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      try {
        await startCameraStream();
        if (activeCall && peer) {
          // Replace media track or renegotiate call safely
          connectToHost();
        }
      } catch (err) {
        showError("Failed to flip camera: " + err.message);
      }
    }

    function updateStatus(text, color) {
      const colorMap = {
        emerald: "bg-emerald-500/20 text-emerald-400 border-emerald-500/30 bg-emerald-400",
        amber: "bg-amber-500/20 text-amber-400 border-amber-500/30 bg-amber-400",
        red: "bg-red-500/20 text-red-400 border-red-500/30 bg-red-400"
      };

      const dotColor = (color === "emerald") ? "bg-emerald-400" : (color === "amber") ? "bg-amber-400 animate-pulse" : "bg-red-400 animate-pulse";
      const badgeClass = (color === "emerald") ? "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" : (color === "amber") ? "bg-amber-500/20 text-amber-400 border-amber-500/30" : "bg-red-500/20 text-red-400 border-red-500/30";

      statusBadge.className = `absolute top-4 left-4 border backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-2 ${badgeClass}`;
      statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor}"></span> ${text}`;
    }

    function showError(msg) {
      errorBanner.innerText = msg;
      errorBanner.classList.remove('hidden');
    }

    function hideError() {
      errorBanner.classList.add('hidden');
    }
  </script>
</body>
</html>
