<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashBooth Pro — Mobile Camera</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Top Status Bar -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-30">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-camera text-indigo-400 text-xl"></i>
      <h1 class="font-bold text-sm tracking-wide text-white">FlashBooth <span class="text-indigo-400">Mobile</span></h1>
    </div>
    <div class="flex items-center gap-2">
      <!-- Grid Toggle Button -->
      <button onclick="toggleMobileGrid()" id="btnMobileGrid" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shadow">
        <i class="fa-solid fa-table-cells"></i> <span id="mobileGridText">Grid: Off</span>
      </button>
      <span id="connStatus" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Connecting
      </span>
    </div>
  </header>

  <!-- Camera Viewport Container -->
  <main class="flex-1 relative bg-black flex items-center justify-center overflow-hidden">
    <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
    <canvas id="captureCanvas" class="hidden"></canvas>

    <!-- 3x3 Alignment Grid Overlay -->
    <div id="mobileGridOverlay" class="absolute inset-0 pointer-events-none grid grid-cols-3 grid-rows-3 opacity-60 hidden z-20">
      <div class="border-r border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class="border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class="border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class="border-r border-b border-white/50"></div>
      <div class=""></div>
    </div>

    <!-- Start Camera Overlay (Required for Browser Autoplay / Permissions) -->
    <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md z-40 flex flex-col items-center justify-center p-6 text-center">
      <i class="fa-solid fa-camera-retro text-6xl text-indigo-400 mb-4 animate-bounce"></i>
      <h2 class="text-xl font-bold text-white mb-2">Ready to Connect</h2>
      <p class="text-xs text-slate-400 max-w-xs mb-6">Tap below to grant camera access and connect to your PC photobooth control station.</p>
      <button onclick="initMobileCameraSession()" class="w-full max-w-xs py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition text-base flex items-center justify-center gap-2">
        <i class="fa-solid fa-play"></i> Start Camera & Connect
      </button>
    </div>
  </main>

  <!-- Mobile Script Logic -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId');

    const localVideo = document.getElementById('localVideo');
    const captureCanvas = document.getElementById('captureCanvas');
    const connStatus = document.getElementById('connStatus');
    const startOverlay = document.getElementById('startOverlay');
    
    let localStream = null;
    let peer = null;
    let dataConn = null;
    let isGridOn = false;

    function toggleMobileGrid() {
      isGridOn = !isGridOn;
      const overlay = document.getElementById('mobileGridOverlay');
      const gridText = document.getElementById('mobileGridText');
      const btnGrid = document.getElementById('btnMobileGrid');

      if (isGridOn) {
        overlay.classList.remove('hidden');
        gridText.innerText = "Grid: On";
        btnGrid.className = "text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shadow";
      } else {
        overlay.classList.add('hidden');
        gridText.innerText = "Grid: Off";
        btnGrid.className = "text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shadow";
      }
    }

    async function initMobileCameraSession() {
      if (!roomId) {
        alert("Error: Missing Room ID in URL!");
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        localVideo.srcObject = localStream;
        await localVideo.play();
        startOverlay.classList.add('hidden');

        connectToHostPeer(roomId);
      } catch (err) {
        alert("Camera permission error: " + err.message);
      }
    }

    function connectToHostPeer(hostId) {
      peer = new Peer({
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        connStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        connStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Connected`;

        // Call host with media stream
        const call = peer.call(hostId, localStream);
        call.on('close', () => updateDisconnectedState());

        // Connect data channel for triggers
        dataConn = peer.connect(hostId);
        dataConn.on('data', (packet) => {
          if (packet.type === 'TRIGGER_HIGH_RES_CAPTURE') {
            captureAndSendHighResPhoto();
          }
        });
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        updateDisconnectedState();
      });
    }

    function captureAndSendHighResPhoto() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      const settings = track.getSettings();

      const width = settings.width || 1920;
      const height = settings.height || 1080;

      captureCanvas.width = width;
      captureCanvas.height = height;
      const ctx = captureCanvas.getContext('2d');
      ctx.drawImage(localVideo, 0, 0, width, height);

      const highResDataUrl = captureCanvas.toDataURL('image/jpeg', 0.95);

      if (dataConn && dataConn.open) {
        dataConn.send({
          type: 'HIGH_RES_PHOTO',
          data: highResDataUrl
        });
      }
    }

    function updateDisconnectedState() {
      connStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30";
      connStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400 animate-pulse"></span> Disconnected`;
    }
  </script>
</body>
</html>
